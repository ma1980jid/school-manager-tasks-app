  <meta name="twitter:card" content="summary_large_image" />

    content="خدمة الاستعلام عن بيانات الطالب في مدرسة الشيخ حمدان بن خميس اليوسفي لمعرفة الصف والشعبة."
  />

  <link rel="stylesheet" href="mobile-fix.css?v=20260905-2" />
</head>
<body>

  <div class="watermark" aria-hidden="true"></div>

  <main class="page-shell">
    <section class="card" aria-labelledby="pageTitle">

      <header class="school-header">
        <div class="school-logo-shell">
          <div class="school-logo-ring">
            <img
              src="school-logo.png"
              alt="شعار مدرسة الشيخ حمدان بن خميس اليوسفي"
              class="school-logo"
            />
          </div>
        </div>

        <p class="school-label">مدرسة</p>

        <h1 class="school-name">الشيخ حمدان بن خميس اليوسفي</h1>
      </header>

      <section class="intro">
        <div class="title-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            width="28"
            height="28"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
        </div>

        <h2 id="pageTitle">الاستعلام عن بيانات الطالب</h2>

        <p>
          يمكنك البحث بالاسم الثلاثي أو بالاسم كما هو مسجل في المدرسة،
          ولا يشترط كتابة كلمة «بن».
        </p>
      </section>

      <form id="searchForm" class="search-box" novalidate>
        <label for="studentName">اسم الطالب</label>

        <div class="input-wrap">
          <input
            type="text"
            id="studentName"
            name="studentName"
            placeholder="حمدان بن خميس اليوسفي"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            maxlength="120"
            required
          />
        </div>

        <button id="searchButton" type="submit">
          <span class="button-content">
            <span class="button-text">بحث</span>
            <svg
              class="search-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
          </span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <footer>
        <span>جميع الحقوق محفوظة ©</span>
        <strong>مدرسة الشيخ حمدان بن خميس اليوسفي</strong>
      </footer>

    </section>
  </main>

  <div
    id="resultModal"
    class="result-modal hidden"
    aria-hidden="true"
  >
    <div id="resultBackdrop" class="result-backdrop"></div>

    <section
      class="result-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="resultTitle"
    >
      <button
        id="closeResultButton"
        class="result-close"
        type="button"
        aria-label="إغلاق"
      >
        ×
      </button>

      <div class="result-sheet-head">
        <div class="success-badge">✓</div>
        <div>
          <p class="result-mini">تم العثور على الطالب</p>
          <h3 id="resultTitle">بيانات الطالب</h3>
        </div>
      </div>

      <div class="result-grid">
        <div class="result-box result-box-wide">
          <span>اسم الطالب</span>
          <strong id="studentNameResult"></strong>
        </div>

        <div class="result-box">
          <span>مقيد بالصف</span>
          <strong id="gradeResult"></strong>
        </div>

        <div class="result-box">
          <span>الشعبة</span>
          <strong id="sectionResult"></strong>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js?v=20260905-3"></script>
</body>
</html>
