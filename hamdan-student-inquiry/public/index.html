<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#103A5D">

  <meta
    name="description"
    content="الاستعلام عن بيانات الطالب - مدرسة الشيخ حمدان بن خميس اليوسفي"
  >

  <title>مدرسة الشيخ حمدان بن خميس اليوسفي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="watermark" aria-hidden="true"></div>

  <main class="page-shell">

    <section class="card" aria-labelledby="pageTitle">

      <!-- رأس الصفحة -->
      <header class="school-header">

        <div class="school-logo-shell">
          <div class="school-logo-ring">
            <img
              src="school-logo.png"
              alt="شعار مدرسة الشيخ حمدان بن خميس اليوسفي"
              class="school-logo"
            >
          </div>
        </div>

        <p class="school-label">مدرسة</p>

        <h1 class="school-name">
          الشيخ حمدان بن خميس اليوسفي
        </h1>

      </header>

      <!-- مقدمة -->
      <section class="intro">

        <div class="title-icon" aria-hidden="true">

          <svg
            viewBox="0 0 24 24"
            width="29"
            height="29"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>

        </div>

        <h2 id="pageTitle">
          الاستعلام عن بيانات الطالب
        </h2>

        <p>
          يمكنك البحث بالاسم الثلاثي أو بالاسم كما هو مسجل في المدرسة،
          ولا يشترط كتابة كلمة «بن».
        </p>

      </section>

      <!-- نموذج البحث -->
      <form
        id="searchForm"
        class="search-box"
        novalidate
      >

        <label for="studentName">
          اسم الطالب
        </label>

        <div class="input-wrap">

          <input
            type="text"
            id="studentName"
            name="studentName"
            placeholder="حمدان بن خميس اليوسفي"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            maxlength="120"
            required
          >

        </div>

        <button
          id="searchButton"
          type="submit"
        >

          <span class="button-content">

            <svg
              class="search-icon"
              viewBox="0 0 24 24"
              width="21"
              height="21"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>

            <span class="button-text">
              بحث
            </span>

          </span>

          <span
            class="spinner"
            aria-hidden="true"
          ></span>

        </button>

      </form>

      <!-- الرسائل -->
      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <!-- نتيجة البحث -->
      <section
        id="result"
        class="result hidden"
        aria-labelledby="resultTitle"
      >

        <div class="result-head">

          <span
            class="success-mark"
            aria-hidden="true"
          >
            ✓
          </span>

          <div>

            <p class="eyebrow">
              تم العثور على الطالب
            </p>

            <h3 id="resultTitle">
              بيانات الطالب
            </h3>

          </div>

        </div>

        <div class="student-info">

          <div class="info-item info-wide">

            <span>
              اسم الطالب
            </span>

            <strong id="studentNameResult"></strong>

          </div>

          <div class="info-item">

            <span>
              مقيد بالصف
            </span>

            <strong id="gradeResult"></strong>

          </div>

          <div class="info-item">

            <span>
              الشعبة
            </span>

            <strong id="sectionResult"></strong>

          </div>

        </div>

      </section>

      <!-- التذييل -->
      <footer>

        <span>
          جميع الحقوق محفوظة ©
        </span>

        <strong>
          مدرسة الشيخ حمدان بن خميس اليوسفي
        </strong>

      </footer>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
