<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#103A5D">

  <!-- ========================================
       عنوان الصفحة
  ========================================= -->

  <title>مدرسة الشيخ حمدان بن خميس اليوسفي</title>

  <meta
    name="description"
    content="خدمة الاستعلام عن بيانات الطالب في مدرسة الشيخ حمدان بن خميس اليوسفي لمعرفة الصف والشعبة."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <!-- ========================================
       الرابط الرسمي
  ========================================= -->

  <link
    rel="canonical"
    href="https://hamdan-yousufi-students.onrender.com/"
  >

  <!-- ========================================
       معاينة الرابط في واتساب
       Facebook / WhatsApp Open Graph
  ========================================= -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:locale"
    content="ar_OM"
  >

  <meta
    property="og:site_name"
    content="مدرسة الشيخ حمدان بن خميس اليوسفي"
  >

  <meta
    property="og:title"
    content="مدرسة الشيخ حمدان بن خميس اليوسفي"
  >

  <meta
    property="og:description"
    content="خدمة الاستعلام عن بيانات الطالب لمعرفة الصف والشعبة."
  >

  <meta
    property="og:url"
    content="https://hamdan-yousufi-students.onrender.com/"
  >

  <!--
    لا نضع og:image هنا عمدًا
    حتى تكون المعاينة في واتساب نصية ومختصرة
    مثل المثال الذي أرسلته.
  -->

  <!-- ========================================
       أيقونة الموقع
  ========================================= -->

  <link
    rel="icon"
    type="image/png"
    href="/school-logo.png"
  >

  <link
    rel="apple-touch-icon"
    href="/school-logo.png"
  >

  <!-- ========================================
       الخط
  ========================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- ========================================
       CSS
  ========================================= -->

  <link
    rel="stylesheet"
    href="style.css?v=20260905-5"
  >

  <link
    rel="stylesheet"
    href="mobile-fix.css?v=20260905-5"
  >

</head>


<body>

  <!-- ========================================
       العلامة المائية
  ========================================= -->

  <div
    class="watermark"
    aria-hidden="true"
  ></div>


  <!-- ========================================
       الصفحة الرئيسية
  ========================================= -->

  <main class="page-shell">

    <section
      class="card"
      aria-labelledby="pageTitle"
    >


      <!-- ====================================
           رأس الصفحة
      ===================================== -->

      <header class="school-header">

        <div class="school-logo-shell">

          <div class="school-logo-ring">

            <img
              src="school-logo.png"
              alt="شعار مدرسة الشيخ حمدان بن خميس اليوسفي"
              class="school-logo"
            >

          </div>

        </div>


        <p class="school-label">
          مدرسة
        </p>


        <h1 class="school-name">
          الشيخ حمدان بن خميس اليوسفي
        </h1>

      </header>


      <!-- ====================================
           مقدمة البحث
      ===================================== -->

      <section class="intro">

        <div
          class="title-icon"
          aria-hidden="true"
        >

          <svg
            viewBox="0 0 24 24"
            width="28"
            height="28"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <circle
              cx="11"
              cy="11"
              r="7"
            ></circle>

            <path
              d="m20 20-3.5-3.5"
            ></path>

          </svg>

        </div>


        <h2 id="pageTitle">
          الاستعلام عن بيانات الطالب
        </h2>


        <p>
          يمكنك البحث بالاسم الثلاثي أو بالاسم كما هو مسجل في المدرسة،
          ولا يشترط كتابة كلمة «بن».
        </p>

      </section>


      <!-- ====================================
           نموذج البحث
      ===================================== -->

      <form
        id="searchForm"
        class="search-box"
        novalidate
      >


        <label for="studentName">
          اسم الطالب
        </label>


        <div class="input-wrap">

          <input
            type="text"
            id="studentName"
            name="studentName"
            placeholder="حمدان بن خميس اليوسفي"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            maxlength="120"
            required
          >

        </div>


        <button
          id="searchButton"
          type="submit"
        >

          <span class="button-content">

            <span class="button-text">
              بحث
            </span>


            <svg
              class="search-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >

              <circle
                cx="11"
                cy="11"
                r="7"
              ></circle>

              <path
                d="m20 20-3.5-3.5"
              ></path>

            </svg>

          </span>


          <span
            class="spinner"
            aria-hidden="true"
          ></span>

        </button>

      </form>


      <!-- ====================================
           الرسائل
      ===================================== -->

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>


      <!-- ====================================
           التذييل
      ===================================== -->

      <footer>

        <span>
          جميع الحقوق محفوظة ©
        </span>

        <strong>
          مدرسة الشيخ حمدان بن خميس اليوسفي
        </strong>

      </footer>


    </section>

  </main>


  <!-- ========================================
       نافذة نتيجة البحث
  ========================================= -->

  <div
    id="resultModal"
    class="result-modal hidden"
    aria-hidden="true"
  >


    <!-- الخلفية المعتمة -->

    <div
      id="resultBackdrop"
      class="result-backdrop"
    ></div>


    <!-- بطاقة البيانات -->

    <section
      class="result-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="resultTitle"
    >


      <!-- زر الإغلاق -->

      <button
        id="closeResultButton"
        class="result-close"
        type="button"
        aria-label="إغلاق"
      >
        ×
      </button>


      <!-- رأس النتيجة -->

      <div class="result-sheet-head">

        <div class="success-badge">
          ✓
        </div>


        <div>

          <p class="result-mini">
            تم العثور على الطالب
          </p>


          <h3 id="resultTitle">
            بيانات الطالب
          </h3>

        </div>

      </div>


      <!-- بيانات الطالب -->

      <div class="result-grid">


        <!-- اسم الطالب -->

        <div class="result-box result-box-wide">

          <span>
            اسم الطالب
          </span>

          <strong
            id="studentNameResult"
          ></strong>

        </div>


        <!-- الصف -->

        <div class="result-box">

          <span>
            مقيد بالصف
          </span>

          <strong
            id="gradeResult"
          ></strong>

        </div>


        <!-- الشعبة -->

        <div class="result-box">

          <span>
            الشعبة
          </span>

          <strong
            id="sectionResult"
          ></strong>

        </div>


      </div>

    </section>

  </div>


  <!-- ========================================
       JavaScript
  ========================================= -->

  <script
    src="script.js?v=20260905-5"
  ></script>


</body>

</html>
